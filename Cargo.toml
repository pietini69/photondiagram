[package]
name = "photon_diagram"
version = "1.0.0"
edition = "2021"
authors = ["Niko Pietinen"]
description = "PhotonDiagram – Modern, high-performance technical diagramming, electrical schematics, floor plans, and CAD drawing tool with full .vsdx, .vdx, .vsd, .vssx, .svg, .dxf, and LightBurn .lbrn2 support."
license = "GPL-3.0-or-later"
repository = "https://github.com/pietini69/photondiagram"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
roxmltree = "0.20"
miniz_oxide = "0.8"
crc32fast = "1.4"
eframe = { version = "0.31", features = ["persistence"] }
rfd = "0.15"
pollster = "0.4"
log = "0.4"
env_logger = "0.11"

[lib]
name = "photon_diagram"
path = "src/lib.rs"

[[bin]]
name = "photondiagram"
path = "src/main.rs"
